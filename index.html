<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculatrice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container">
        <div class="calcontainer">
            <div class="result">
                <input id="resulta" type="text" placeholder="0" disabled>
            </div>
            <button id="btnC" type="button" value="C">C</button>
            <button id="btnflech" type="button" value="--"><--</button>
            <button id="btnmod" type="button" value="%">%</button>
            <button id="btnsur" type="button" value="/">/</button>
            <button id="btn1" type="button" value="1">1</button>
            <button id="btn2" type="button" value="2">2</button>
            <button id="btn3" type="button" value="3">3</button>
            <button id="btnplus" type="button" value="+">+</button>
            <button id="btn4" type="button" value="4">4</button>
            <button id="btn5" type="button" value="5">5</button>
            <button id="btn6" type="button" value="6">6</button>
            <button id="btnmoin" type="button" value="-">-</button>
            <button id="btn7" type="button" value="7">7</button>
            <button id="btn8" type="button" value="8">8</button>
            <button id="btn9" type="button" value="9">9</button>
            <button id="btnfoi" type="button" value="*">*</button>
            <button id="btnepoint" type="button" value=".">.</button>
            <button id="btn0" type="button" value="0">0</button>
            <button id="btnegal" type="button" value="=">=</button>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
